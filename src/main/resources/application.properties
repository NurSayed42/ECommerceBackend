# ============================================
# SSLCOMMERZ PAYMENT (Sandbox)
# ============================================
sslcommerz.store-id=your_store_id
sslcommerz.store-passwd=your_store_password
sslcommerz.base-url=https://sandbox.sslcommerz.com
sslcommerz.success-url=http://localhost:8085/api/v1/payments/sslcommerz/success
sslcommerz.fail-url=http://localhost:8085/api/v1/payments/sslcommerz/fail
sslcommerz.cancel-url=http://localhost:8085/api/v1/payments/sslcommerz/cancel

# ============================================
# THYMELEAF ADMIN
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ============================================
# SWAGGER / API DOCS
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================================
# ACTUATOR
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================
# LOGGING
# ============================================
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.security=INFO
logging.file.name=logs/ecommerce.log

# ============================================
# APP SETTINGS
# ============================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001
app.otp.expiry-minutes=5
app.pagination.default-page-size=12




spring.web.resources.static-locations=classpath:/static/,file:uploads/
