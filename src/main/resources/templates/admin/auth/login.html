<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login - ShopAdmin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4f46e5 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,.25);
        }
        .brand-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.8rem; color: #fff;
        }
        .form-control {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: .9rem;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,.15);
        }
        .input-group-text {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px 0 0 10px;
            background: #f8fafc;
            color: #6366f1;
        }
        .input-group .form-control { border-radius: 0 10px 10px 0; border-left: none; }
        .btn-login {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none; border-radius: 10px;
            padding: 12px; font-weight: 600;
            font-size: .95rem; color: #fff;
            transition: transform .2s, box-shadow .2s;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(99,102,241,.4);
            color: #fff;
        }
        .alert { border-radius: 10px; font-size: .875rem; }
        .form-check-input:checked { background-color: #6366f1; border-color: #6366f1; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand-icon"><i class="bi bi-shop"></i></div>
        <h4 class="fw-700 mb-1" style="font-weight:700;color:#1e293b">ShopAdmin</h4>
        <p class="text-muted small mb-0">Sign in to your admin account</p>
    </div>

    <!-- Error Alert -->
    <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center mb-3">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        Invalid email or password. Please try again.
    </div>
    <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center mb-3">
        <i class="bi bi-check-circle-fill me-2"></i>
        You have been logged out successfully.
    </div>

    <form th:action="@{/admin/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label fw-500 small" style="font-weight:500;color:#374151">Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" name="email" class="form-control"
                       placeholder="admin@example.com" required autocomplete="email"/>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-500 small" style="font-weight:500;color:#374151">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" id="passwordInput" class="form-control"
                       placeholder="Enter your password" required autocomplete="current-password"/>
                <button type="button" class="btn btn-outline-secondary" id="togglePwd"
                        style="border-radius:0 10px 10px 0;border:1.5px solid #e2e8f0;border-left:none">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" name="remember-me"/>
                <label class="form-check-label small text-muted" for="remember">Remember me</label>
            </div>
            <a href="#" class="small text-decoration-none" style="color:#6366f1">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-login w-100 mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
    </form>

    <p class="text-center text-muted small mt-3 mb-0">
        <i class="bi bi-shield-lock me-1"></i>
        Secured by JWT + Spring Security
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('togglePwd').addEventListener('click', () => {
        const inp = document.getElementById('passwordInput');
        const icon = document.getElementById('eyeIcon');
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            inp.type = 'password';
            icon.className = 'bi bi-eye';
        }
    });
</script>
</body>
</html>
