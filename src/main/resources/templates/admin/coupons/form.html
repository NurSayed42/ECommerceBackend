<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::content}, ~{::extraScripts})}">
<title>New Coupon</title>

<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h5 class="fw-bold mb-1" style="color:#1e293b">Create Coupon</h5>
        <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0" style="font-size:.8rem">
            <li class="breadcrumb-item"><a th:href="@{/admin/coupons}">Coupons</a></li>
            <li class="breadcrumb-item active">New</li>
        </ol></nav>
    </div>
    <a th:href="@{/admin/coupons}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Back
    </a>
</div>

<form th:action="@{/admin/coupons/new}" method="post">
<div class="row g-4">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header"><i class="bi bi-ticket-perforated me-2 text-primary"></i>Coupon Details</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Coupon Code <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="text" name="code" class="form-control text-uppercase"
                                   placeholder="SAVE20" required id="couponCode"
                                   style="text-transform:uppercase"/>
                            <button type="button" class="btn btn-outline-secondary" onclick="generateCode()">
                                <i class="bi bi-dice-5"></i> Generate
                            </button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Coupon Type <span class="text-danger">*</span></label>
                        <select name="type" class="form-select" required id="couponType" onchange="toggleFields()">
                            <option value="">Select Type</option>
                            <option th:each="t : ${types}" th:value="${t}" th:text="${t}">Type</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Description</label>
                        <input type="text" name="description" class="form-control"
                               placeholder="e.g. Get 20% off on orders above ৳500"/>
                    </div>

                    <!-- Discount Value -->
                    <div class="col-md-4" id="discountValueGroup">
                        <label class="form-label">Discount Value <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="number" name="discountValue" class="form-control"
                                   step="0.01" min="0" placeholder="0" id="discountValue"/>
                            <span class="input-group-text" id="discountUnit">%</span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Min Order Amount (৳)</label>
                        <div class="input-group">
                            <span class="input-group-text">৳</span>
                            <input type="number" name="minOrderAmount" class="form-control"
                                   step="0.01" min="0" placeholder="500"/>
                        </div>
                    </div>
                    <div class="col-md-4" id="maxDiscGroup">
                        <label class="form-label">Max Discount Amount (৳)</label>
                        <div class="input-group">
                            <span class="input-group-text">৳</span>
                            <input type="number" name="maxDiscountAmount" class="form-control"
                                   step="0.01" min="0" placeholder="200"/>
                        </div>
                        <div class="form-text">Caps the discount for % type</div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Total Usage Limit</label>
                        <input type="number" name="usageLimit" class="form-control"
                               min="0" placeholder="0 = unlimited"/>
                        <div class="form-text">0 means unlimited</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Per User Limit</label>
                        <input type="number" name="perUserLimit" class="form-control"
                               min="1" value="1"/>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Start Date <span class="text-danger">*</span></label>
                        <input type="datetime-local" name="startDate" class="form-control" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">End Date <span class="text-danger">*</span></label>
                        <input type="datetime-local" name="endDate" class="form-control" required/>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="card mb-4">
            <div class="card-header"><i class="bi bi-send me-2 text-primary"></i>Publish</div>
            <div class="card-body">
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" name="active" id="activeSwitch" checked/>
                    <label class="form-check-label small" for="activeSwitch">Active (visible to users)</label>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Create Coupon
                    </button>
                    <a th:href="@{/admin/coupons}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><i class="bi bi-lightbulb me-2 text-warning"></i>Tips</div>
            <div class="card-body">
                <ul class="small text-muted mb-0 ps-3">
                    <li class="mb-1">Use UPPERCASE for coupon codes</li>
                    <li class="mb-1">Set usage limit to prevent abuse</li>
                    <li class="mb-1">Set max discount to cap percentage off</li>
                    <li>Set min order to encourage larger orders</li>
                </ul>
            </div>
        </div>
    </div>
</div>
</form>
</th:block>

<th:block th:fragment="extraScripts">
<script>
    function generateCode() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let code = '';
        for (let i = 0; i < 8; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
        document.getElementById('couponCode').value = code;
    }

    function toggleFields() {
        const type = document.getElementById('couponType').value;
        const discGroup = document.getElementById('discountValueGroup');
        const maxDiscGroup = document.getElementById('maxDiscGroup');
        const unit = document.getElementById('discountUnit');

        discGroup.style.display = type === 'FREE_SHIPPING' ? 'none' : '';
        maxDiscGroup.style.display = type === 'PERCENTAGE' ? '' : 'none';
        unit.textContent = type === 'FIXED_AMOUNT' ? '৳' : '%';
    }

    // Set default dates
    const now = new Date();
    const future = new Date(now);
    future.setDate(future.getDate() + 30);

    const toLocal = d => d.toISOString().slice(0, 16);
    document.querySelector('[name="startDate"]').value = toLocal(now);
    document.querySelector('[name="endDate"]').value = toLocal(future);

    // Auto uppercase code
    document.getElementById('couponCode').addEventListener('input', function() {
        this.value = this.value.toUpperCase();
    });
</script>
</th:block>
</html>
