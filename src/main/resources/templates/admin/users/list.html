<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::content}, ~{::extraScripts})}">
<title>Users</title>

<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h5 class="fw-bold mb-1" style="color:#1e293b">Users</h5>
        <small class="text-muted">Manage customer accounts</small>
    </div>
    <button class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-download me-1"></i>Export
    </button>
</div>

<div class="card mb-4">
    <div class="card-body py-3">
        <form th:action="@{/admin/users}" method="get" class="row g-2 align-items-center">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" name="q" class="form-control border-start-0"
                           placeholder="Search name, email, phone..." th:value="${q}"/>
                </div>
            </div>
            <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">Search</button></div>
            <div class="col-md-2"><a th:href="@{/admin/users}" class="btn btn-outline-secondary w-100">Clear</a></div>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-people me-2"></i>User List</span>
        <span class="badge bg-primary bg-opacity-10 text-primary"
              th:text="${users.totalElements} + ' users'">0</span>
    </div>
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead style="background:#f8fafc">
                <tr>
                    <th class="ps-4">User</th>
                    <th>Contact</th>
                    <th>Verified</th>
                    <th>Status</th>
                    <th>Provider</th>
                    <th>Joined</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users.content}">
                    <td class="ps-4">
                        <div class="d-flex align-items-center gap-3">
                            <div class="rounded-circle d-flex align-items-center justify-content-center"
                                 style="width:38px;height:38px;background:#ede9fe;color:#7c3aed;font-weight:600;flex-shrink:0"
                                 th:text="${#strings.toUpperCase(#strings.substring(u.fullName, 0, 1))}">A</div>
                            <div>
                                <div class="fw-500 small" style="font-weight:500" th:text="${u.fullName}">Name</div>
                                <span th:if="${u.fraudFlag}" class="badge bg-danger" style="font-size:.65rem">⚠ Fraud Flagged</span>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="small" th:text="${u.email ?: '-'}">Email</div>
                        <div class="text-muted" style="font-size:.75rem" th:text="${u.phone ?: '-'}">Phone</div>
                    </td>
                    <td>
                        <span th:if="${u.emailVerified}" class="badge bg-success bg-opacity-10 text-success me-1" style="font-size:.7rem">✓ Email</span>
                        <span th:if="${u.phoneVerified}" class="badge bg-info bg-opacity-10 text-info" style="font-size:.7rem">✓ Phone</span>
                        <span th:if="${!u.emailVerified and !u.phoneVerified}" class="badge bg-warning text-dark" style="font-size:.7rem">Unverified</span>
                    </td>
                    <td>
                        <span th:if="${u.blocked}" class="badge bg-danger">Blocked</span>
                        <span th:if="${!u.blocked and u.active}" class="badge bg-success">Active</span>
                        <span th:if="${!u.active}" class="badge bg-secondary">Deactivated</span>
                    </td>
                    <td>
                        <span class="badge bg-secondary bg-opacity-10 text-secondary" th:text="${u.provider}">LOCAL</span>
                    </td>
                    <td>
                        <div class="small" th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}">Date</div>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <a th:href="@{'/admin/users/' + ${u.id}}"
                               class="btn btn-xs btn-outline-primary" style="font-size:.75rem;padding:3px 8px">
                                <i class="bi bi-eye"></i>
                            </a>
                            <form th:if="${!u.blocked}"
                                  th:action="@{'/admin/users/' + ${u.id} + '/block'}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Block this user?')">
                                <input type="hidden" name="reason" value="Blocked by admin"/>
                                <button class="btn btn-xs btn-outline-warning" style="font-size:.75rem;padding:3px 8px" title="Block">
                                    <i class="bi bi-ban"></i>
                                </button>
                            </form>
                            <form th:if="${u.blocked}"
                                  th:action="@{'/admin/users/' + ${u.id} + '/unblock'}"
                                  method="post" class="d-inline">
                                <button class="btn btn-xs btn-outline-success" style="font-size:.75rem;padding:3px 8px" title="Unblock">
                                    <i class="bi bi-check-circle"></i>
                                </button>
                            </form>
                            <form th:action="@{'/admin/users/' + ${u.id} + '/flag-fraud'}"
                                  method="post" class="d-inline">
                                <button class="btn btn-xs"
                                        style="font-size:.75rem;padding:3px 8px"
                                        th:classappend="${u.fraudFlag ? 'btn-danger' : 'btn-outline-danger'}"
                                        title="Toggle Fraud Flag">
                                    <i class="bi bi-exclamation-triangle"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users.content)}">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="bi bi-people fs-2 d-block mb-2"></i>No users found.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card-footer d-flex justify-content-between align-items-center py-3"
         th:if="${users.totalPages > 1}">
        <small class="text-muted">
            Page <span th:text="${users.number + 1}">1</span> of <span th:text="${users.totalPages}">1</span>
        </small>
        <nav><ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:classappend="${users.first ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin/users(page=${users.number - 1}, q=${q})}">
                    <i class="bi bi-chevron-left"></i></a>
            </li>
            <li class="page-item" th:classappend="${users.last ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin/users(page=${users.number + 1}, q=${q})}">
                    <i class="bi bi-chevron-right"></i></a>
            </li>
        </ul></nav>
    </div>
</div>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</html>
