<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::content}, ~{::extraScripts})}">
<title>Banners</title>

<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h5 class="fw-bold mb-1" style="color:#1e293b">Banner Manager</h5>
        <small class="text-muted">Control homepage and category banners</small>
    </div>
    <a th:href="@{/admin/banners/new}" class="btn btn-sm btn-primary">
        <i class="bi bi-plus-lg me-1"></i>Add Banner
    </a>
</div>

<div class="row g-3">
    <div th:each="banner : ${allBanners}" class="col-md-6 col-xl-4">
        <div class="card h-100">
            <!-- Banner Preview -->
            <div style="height:160px;background:#f1f5f9;border-radius:12px 12px 0 0;overflow:hidden;position:relative">
                <img th:if="${banner.imageUrl != null}"
                     th:src="${banner.imageUrl}"
                     style="width:100%;height:100%;object-fit:cover"
                     th:alt="${banner.title}"
                     onerror="this.style.display='none'"/>
                <div th:if="${banner.imageUrl == null}"
                     class="d-flex align-items-center justify-content-center h-100 text-muted">
                    <i class="bi bi-image fs-1"></i>
                </div>

                <!-- Status badge -->
                <div style="position:absolute;top:10px;right:10px">
                    <span class="badge" th:classappend="${banner.active ? 'bg-success' : 'bg-secondary'}"
                          th:text="${banner.active ? 'Active' : 'Inactive'}">Active</span>
                </div>

                <!-- Position badge -->
                <div style="position:absolute;top:10px;left:10px">
                    <span class="badge bg-dark bg-opacity-75" style="font-size:.65rem"
                          th:text="${banner.position}">HOME_HERO</span>
                </div>
            </div>

            <div class="card-body">
                <h6 class="fw-600 mb-1" th:text="${banner.title}">Banner Title</h6>
                <div class="d-flex gap-2 small text-muted mb-2">
                    <span th:if="${banner.sortOrder != null}">
                        <i class="bi bi-sort-numeric-up me-1"></i>Order: <span th:text="${banner.sortOrder}">0</span>
                    </span>
                    <span th:if="${banner.startDate != null}">
                        <i class="bi bi-calendar me-1"></i>
                        <span th:text="${#temporals.format(banner.startDate, 'dd MMM')}">Date</span>
                    </span>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{'/admin/banners/' + ${banner.id} + '/edit'}"
                       class="btn btn-sm btn-outline-primary flex-grow-1">
                        <i class="bi bi-pencil me-1"></i>Edit
                    </a>
                    <form th:action="@{'/admin/banners/' + ${banner.id} + '/delete'}"
                          method="post"
                          onsubmit="return confirm('Delete this banner?')">
                        <button class="btn btn-sm btn-outline-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(allBanners)}" class="col-12">
        <div class="card">
            <div class="card-body text-center py-5 text-muted">
                <i class="bi bi-image fs-1 d-block mb-3"></i>
                <p>No banners yet.</p>
                <a th:href="@{/admin/banners/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>Add First Banner
                </a>
            </div>
        </div>
    </div>
</div>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</html>
