<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::content}, ~{::extraScripts})}">
<title>Products</title>

<th:block th:fragment="content">

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h5 class="fw-bold mb-1" style="color:#1e293b">Products</h5>
        <small class="text-muted">Manage your product catalog</small>
    </div>
    <div class="d-flex gap-2">
        <a th:href="@{/admin/products/low-stock}" class="btn btn-sm btn-outline-warning">
            <i class="bi bi-exclamation-triangle me-1"></i>Low Stock
        </a>
        <a th:href="@{/admin/products/new}" class="btn btn-sm btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Add Product
        </a>
    </div>
</div>

<!-- Search & Filter -->
<div class="card mb-4">
    <div class="card-body py-3">
        <form th:action="@{/admin/products}" method="get" class="row g-2 align-items-center">
            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" name="q" class="form-control border-start-0"
                           placeholder="Search products, SKU, brand..."
                           th:value="${q}"/>
                </div>
            </div>
            <div class="col-md-3">
                <select name="categoryId" class="form-select">
                    <option value="">All Categories</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}">Category</option>
                </select>
            </div>
            <div class="col-md-2">
                <select name="status" class="form-select">
                    <option value="">All Status</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                    <option value="low_stock">Low Stock</option>
                </select>
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-grow-1">Filter</button>
                <a th:href="@{/admin/products}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-lg"></i>
                </a>
            </div>
        </form>
    </div>
</div>

<!-- Products Table -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-box-seam me-2"></i>Product List</span>
        <span class="badge bg-primary bg-opacity-10 text-primary"
              th:text="${products.totalElements} + ' products'">0 products</span>
    </div>
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead style="background:#f8fafc">
                <tr>
                    <th class="ps-4" style="width:40px">
                        <input type="checkbox" class="form-check-input" id="selectAll"/>
                    </th>
                    <th>Product</th>
                    <th>SKU</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Status</th>
                    <th>Flags</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${products.content}">
                    <td class="ps-4">
                        <input type="checkbox" class="form-check-input product-check" th:value="${p.id}"/>
                    </td>
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            <div style="width:44px;height:44px;border-radius:8px;background:#f1f5f9;
                                        display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0">
                                <i class="bi bi-image text-muted" th:if="${p.images == null or p.images.isBlank()}"></i>
                            </div>
                            <div>
                                <div class="fw-500 small" style="font-weight:500;max-width:200px"
                                     th:text="${#strings.abbreviate(p.name, 40)}">Product Name</div>
                                <div class="text-muted" style="font-size:.72rem">
                                    <i class="bi bi-star-fill text-warning" style="font-size:.6rem"></i>
                                    <span th:text="${p.avgRating}">0.0</span>
                                    (<span th:text="${p.reviewCount}">0</span>)
                                </div>
                            </div>
                        </div>
                    </td>
                    <td><code class="small" th:text="${p.sku ?: '-'}">SKU</code></td>
                    <td>
                        <span class="badge bg-secondary bg-opacity-10 text-secondary"
                              th:text="${p.category?.name ?: '-'}">Category</span>
                    </td>
                    <td>
                        <div class="fw-500 small">৳<span th:text="${#numbers.formatDecimal(p.salePrice ?: p.price, 1, 'COMMA', 0, 'POINT')}">0</span></div>
                        <div class="text-decoration-line-through text-muted" style="font-size:.72rem"
                             th:if="${p.salePrice != null}">
                            ৳<span th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 0, 'POINT')}">0</span>
                        </div>
                    </td>
                    <td>
                        <span th:if="${p.stock == 0}" class="badge bg-danger">Out of Stock</span>
                        <span th:if="${p.stock > 0 and p.stock <= p.lowStockThreshold}"
                              class="badge bg-warning text-dark" th:text="${p.stock} + ' (Low)'">Low</span>
                        <span th:if="${p.stock > p.lowStockThreshold}"
                              class="badge bg-success bg-opacity-10 text-success" th:text="${p.stock}">Stock</span>
                    </td>
                    <td>
                        <form th:action="@{'/admin/products/' + ${p.id} + '/toggle-active'}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm p-0 border-0 bg-transparent">
                                <span th:if="${p.active}" class="badge bg-success">Active</span>
                                <span th:unless="${p.active}" class="badge bg-secondary">Inactive</span>
                            </button>
                        </form>
                    </td>
                    <td>
                        <div class="d-flex gap-1 flex-wrap">
                            <span th:if="${p.featured}" class="badge" style="background:#ede9fe;color:#7c3aed;font-size:.65rem">⭐ Featured</span>
                            <span th:if="${p.flashSale}" class="badge" style="background:#fef3c7;color:#d97706;font-size:.65rem">⚡ Flash</span>
                            <span th:if="${p.trending}" class="badge" style="background:#dcfce7;color:#16a34a;font-size:.65rem">🔥 Trend</span>
                        </div>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <a th:href="@{'/admin/products/' + ${p.id} + '/edit'}"
                               class="btn btn-xs btn-outline-primary" style="font-size:.75rem;padding:3px 8px"
                               title="Edit">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{'/admin/products/' + ${p.id} + '/delete'}" method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this product?')">
                                <button class="btn btn-xs btn-outline-danger" style="font-size:.75rem;padding:3px 8px" title="Delete">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products.content)}">
                    <td colspan="9" class="text-center py-5 text-muted">
                        <i class="bi bi-box-seam fs-2 d-block mb-2"></i>
                        No products found. <a th:href="@{/admin/products/new}">Add your first product</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="card-footer d-flex justify-content-between align-items-center py-3" th:if="${products.totalPages > 1}">
        <small class="text-muted">
            Showing <span th:text="${products.number * products.size + 1}">1</span> -
            <span th:text="${#numbers.min(products.number * products.size + products.size, products.totalElements)}">10</span>
            of <span th:text="${products.totalElements}">0</span>
        </small>
        <nav>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${products.first ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/admin/products(page=${products.number - 1}, q=${q})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                    th:if="${i >= products.number - 2 and i <= products.number + 2}"
                    th:classappend="${i == products.number ? 'active' : ''}">
                    <a class="page-link" th:href="@{/admin/products(page=${i}, q=${q})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${products.last ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/admin/products(page=${products.number + 1}, q=${q})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

</th:block>

<th:block th:fragment="extraScripts">
<script>
    // Select All
    document.getElementById('selectAll')?.addEventListener('change', function() {
        document.querySelectorAll('.product-check').forEach(cb => cb.checked = this.checked);
    });
</script>
</th:block>
</html>
