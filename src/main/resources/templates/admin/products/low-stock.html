<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::content}, ~{::extraScripts})}">
<title>Low Stock Products</title>
<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4">
    <div><h5 class="fw-bold mb-1" style="color:#1e293b">Low Stock Alert</h5>
    <small class="text-muted">Products that need restocking</small></div>
    <a th:href="@{/admin/products}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="card">
    <div class="card-header d-flex justify-content-between">
        <span><i class="bi bi-exclamation-triangle text-warning me-2"></i>Low Stock Products</span>
        <span class="badge bg-warning text-dark" th:text="${#lists.size(products)} + ' products'">0</span>
    </div>
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead style="background:#f8fafc">
                <tr><th class="ps-4">Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Stock</th><th>Threshold</th><th>Action</th></tr>
            </thead>
            <tbody>
                <tr th:each="p : ${products}">
                    <td class="ps-4">
                        <div class="fw-500 small" th:text="${p.name}">Name</div>
                        <div class="text-muted" style="font-size:.75rem" th:text="${p.brand ?: ''}">Brand</div>
                    </td>
                    <td><code class="small" th:text="${p.sku ?: '—'}">SKU</code></td>
                    <td><span class="badge bg-secondary bg-opacity-10 text-secondary" th:text="${p.category?.name ?: '—'}">Cat</span></td>
                    <td class="small">৳<span th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 0, 'POINT')}">0</span></td>
                    <td>
                        <span class="badge bg-danger" th:if="${p.stock == 0}">Out of Stock</span>
                        <span class="badge bg-warning text-dark" th:if="${p.stock > 0}" th:text="${p.stock} + ' left'">Low</span>
                    </td>
                    <td class="small text-muted" th:text="${p.lowStockThreshold}">5</td>
                    <td>
                        <a th:href="@{'/admin/products/' + ${p.id} + '/edit'}"
                           class="btn btn-xs btn-outline-primary" style="font-size:.75rem;padding:3px 8px">
                            <i class="bi bi-pencil me-1"></i>Restock
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="bi bi-check-circle-fill text-success fs-2 d-block mb-2"></i>
                        All products are well stocked!
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</html>
