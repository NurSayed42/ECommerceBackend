<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::content}, ~{::extraScripts})}">
<title>Orders</title>

<th:block th:fragment="content">

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h5 class="fw-bold mb-1" style="color:#1e293b">Orders</h5>
        <small class="text-muted">Manage and track all customer orders</small>
    </div>
    <button class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-download me-1"></i>Export CSV
    </button>
</div>

<!-- Status Tab Bar -->
<div class="card mb-3">
    <div class="card-body py-2 px-3">
        <div class="d-flex gap-2 flex-wrap">
            <a th:href="@{/admin/orders}" class="btn btn-sm"
               th:classappend="${selectedStatus == null ? 'btn-primary' : 'btn-outline-secondary'}">All</a>
            <a th:each="s : ${statuses}"
               th:href="@{/admin/orders(status=${s})}"
               class="btn btn-sm"
               th:classappend="${selectedStatus == s ? 'btn-primary' : 'btn-outline-secondary'}"
               th:text="${s}">Status</a>
        </div>
    </div>
</div>

<!-- Search -->
<div class="card mb-4">
    <div class="card-body py-3">
        <form th:action="@{/admin/orders}" method="get" class="row g-2 align-items-center">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input type="text" name="q" class="form-control border-start-0"
                           placeholder="Search order number, customer..." th:value="${q}"/>
                </div>
            </div>
            <input type="hidden" name="status" th:value="${selectedStatus}"/>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Search</button>
            </div>
            <div class="col-md-2">
                <a th:href="@{/admin/orders}" class="btn btn-outline-secondary w-100">Clear</a>
            </div>
        </form>
    </div>
</div>

<!-- Orders Table -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-bag-check me-2"></i>Order List</span>
        <span class="badge bg-primary bg-opacity-10 text-primary"
              th:text="${orders.totalElements} + ' orders'">0 orders</span>
    </div>
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead style="background:#f8fafc">
                <tr>
                    <th class="ps-4">Order #</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders.content}">
                    <td class="ps-4">
                        <a th:href="@{'/admin/orders/' + ${order.orderNumber}}"
                           class="fw-500 text-decoration-none" style="font-weight:600;color:#6366f1"
                           th:text="${order.orderNumber}">ORD-001</a>
                    </td>
                    <td>
                        <div class="small fw-500" th:text="${order.shippingAddress}">Customer</div>
                    </td>
                    <td>
                        <span class="badge bg-secondary bg-opacity-10 text-secondary"
                              th:text="${#lists.size(order.items)} + ' items'">0 items</span>
                    </td>
                    <td>
                        <div class="fw-500 small">৳<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 0, 'POINT')}">0</span></div>
                        <div class="text-muted" style="font-size:.72rem" th:text="${order.paymentMethod}">COD</div>
                    </td>
                    <td>
                        <span class="badge badge-status"
                              th:classappend="${order.paymentStatus.name() == 'PAID' ? 'bg-success' :
                                             order.paymentStatus.name() == 'PENDING' ? 'bg-warning text-dark' : 'bg-danger'}"
                              th:text="${order.paymentStatus}">PAID</span>
                    </td>
                    <td>
                        <span class="badge badge-status"
                              th:classappend="${order.status.name() == 'DELIVERED' ? 'bg-success' :
                                             order.status.name() == 'PENDING' ? 'bg-warning text-dark' :
                                             order.status.name() == 'CANCELLED' ? 'bg-danger' :
                                             order.status.name() == 'SHIPPED' ? 'bg-info' : 'bg-primary'}"
                              th:text="${order.status}">PENDING</span>
                    </td>
                    <td>
                        <div class="small" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}">Date</div>
                        <div class="text-muted" style="font-size:.72rem"
                             th:text="${#temporals.format(order.createdAt, 'hh:mm a')}">Time</div>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <a th:href="@{'/admin/orders/' + ${order.orderNumber}}"
                               class="btn btn-xs btn-outline-primary" style="font-size:.75rem;padding:3px 8px">
                                <i class="bi bi-eye"></i>
                            </a>
                            <div class="dropdown">
                                <button class="btn btn-xs btn-outline-secondary dropdown-toggle"
                                        style="font-size:.75rem;padding:3px 8px"
                                        data-bs-toggle="dropdown">
                                    Status
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end" style="font-size:.8rem">
                                    <li th:each="s : ${statuses}">
                                        <form th:action="@{'/admin/orders/' + ${order.id} + '/status'}" method="post">
                                            <input type="hidden" name="status" th:value="${s}"/>
                                            <button class="dropdown-item" type="submit"
                                                    th:text="${s}"
                                                    th:classappend="${order.status == s ? 'active' : ''}">Status</button>
                                        </form>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders.content)}">
                    <td colspan="8" class="text-center py-5 text-muted">
                        <i class="bi bi-bag-x fs-2 d-block mb-2"></i>No orders found.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="card-footer d-flex justify-content-between align-items-center py-3"
         th:if="${orders.totalPages > 1}">
        <small class="text-muted">
            Page <span th:text="${orders.page + 1}">1</span> of
            <span th:text="${orders.totalPages}">1</span>
        </small>
        <nav>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${orders.first ? 'disabled' : ''}">
                    <a class="page-link"
                       th:href="@{/admin/orders(page=${orders.page - 1}, q=${q}, status=${selectedStatus})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
                <li class="page-item" th:classappend="${orders.last ? 'disabled' : ''}">
                    <a class="page-link"
                       th:href="@{/admin/orders(page=${orders.page + 1}, q=${q}, status=${selectedStatus})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

</th:block>
<th:block th:fragment="extraScripts"></th:block>
</html>
