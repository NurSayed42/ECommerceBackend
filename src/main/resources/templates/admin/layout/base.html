<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content, extraScripts)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:replace="${title}">Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --sidebar-width: 260px;
            --topbar-height: 64px;
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --sidebar-bg: #1e1b4b;
            --sidebar-text: #c7d2fe;
            --sidebar-hover: #312e81;
            --sidebar-active: #4f46e5;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; margin: 0; }
        #sidebar {
            width: var(--sidebar-width); height: 100vh; position: fixed;
            top: 0; left: 0; background: var(--sidebar-bg);
            overflow-y: auto; z-index: 1000; transition: transform 0.3s ease;
        }
        .sidebar-brand { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,.08); }
        .sidebar-brand h5 { color: #fff; font-weight: 700; font-size: 1.1rem; margin: 0; }
        .sidebar-brand small { color: var(--sidebar-text); font-size: .75rem; }
        .sidebar-section { padding: 12px 16px 4px; font-size: .7rem; font-weight: 600;
            color: rgba(199,210,254,.5); text-transform: uppercase; letter-spacing: .08em; }
        .nav-item-link {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 20px; color: var(--sidebar-text);
            text-decoration: none; border-radius: 8px; margin: 2px 8px;
            font-size: .875rem; font-weight: 500; transition: all .2s;
        }
        .nav-item-link:hover { background: var(--sidebar-hover); color: #fff; }
        .nav-item-link.active { background: var(--sidebar-active); color: #fff; }
        #topbar {
            height: var(--topbar-height); margin-left: var(--sidebar-width);
            background: #fff; border-bottom: 1px solid #e2e8f0;
            display: flex; align-items: center; padding: 0 24px;
            position: sticky; top: 0; z-index: 900; gap: 16px;
        }
        .topbar-title { font-weight: 600; font-size: 1rem; color: #1e293b; flex: 1; }
        .topbar-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--primary); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: .9rem; cursor: pointer;
        }
        #main-content { margin-left: var(--sidebar-width); padding: 24px; min-height: calc(100vh - var(--topbar-height)); }
        .stat-card { border-radius: 12px; border: none; box-shadow: 0 1px 3px rgba(0,0,0,.06); transition: transform .2s, box-shadow .2s; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
        .stat-card .icon-box { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .card-header { background: #fff; border-bottom: 1px solid #f1f5f9; padding: 16px 20px; font-weight: 600; font-size: .95rem; }
        .table th { font-size: .75rem; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .05em; border-top: none; }
        .table td { font-size: .875rem; vertical-align: middle; }
        .table-hover tbody tr:hover { background: #f8fafc; }
        .badge-status { font-size: .72rem; padding: .3em .6em; border-radius: 20px; font-weight: 500; }
        .form-label { font-size: .85rem; font-weight: 500; color: #374151; }
        .form-control, .form-select { border: 1px solid #e2e8f0; border-radius: 8px; font-size: .875rem; padding: .5rem .75rem; }
        .form-control:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
        .btn-primary { background: var(--primary); border-color: var(--primary); border-radius: 8px; }
        .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
        .alert { border-radius: 10px; font-size: .875rem; border: none; }
        .pagination .page-link { border-radius: 8px; margin: 0 2px; font-size: .8rem; color: var(--primary); }
        .pagination .page-item.active .page-link { background: var(--primary); border-color: var(--primary); }
        .fw-500 { font-weight: 500 !important; }
        .nav-tabs .nav-link { color: #64748b; border: none; border-bottom: 2px solid transparent; }
        .nav-tabs .nav-link.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.show { transform: translateX(0); }
            #topbar, #main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

<nav id="sidebar">
    <div class="sidebar-brand">
        <h5><i class="bi bi-shop me-2"></i>ShopAdmin</h5>
        <small>Management Panel</small>
    </div>
    <div class="mt-3">
        <div class="sidebar-section">Main</div>
        <a th:href="@{/admin/dashboard}" class="nav-item-link"><i class="bi bi-speedometer2"></i> Dashboard</a>

        <div class="sidebar-section">Catalog</div>
        <a th:href="@{/admin/products}" class="nav-item-link"><i class="bi bi-box-seam"></i> Products</a>
        <a th:href="@{/admin/categories}" class="nav-item-link"><i class="bi bi-diagram-3"></i> Categories</a>

        <div class="sidebar-section">Sales</div>
        <a th:href="@{/admin/orders}" class="nav-item-link"><i class="bi bi-bag-check"></i> Orders</a>
        <a th:href="@{/admin/payments}" class="nav-item-link"><i class="bi bi-credit-card"></i> Payments</a>

        <div class="sidebar-section">Marketing</div>
        <a th:href="@{/admin/coupons}" class="nav-item-link"><i class="bi bi-ticket-perforated"></i> Coupons</a>
        <a th:href="@{/admin/banners}" class="nav-item-link"><i class="bi bi-image"></i> Banners</a>

        <div class="sidebar-section">People</div>
        <a th:href="@{/admin/users}" class="nav-item-link"><i class="bi bi-people"></i> Users</a>
        <a th:href="@{/admin/reviews}" class="nav-item-link"><i class="bi bi-star"></i> Reviews</a>

        <div class="sidebar-section">Config</div>
        <a th:href="@{/admin/settings}" class="nav-item-link"><i class="bi bi-gear"></i> Settings</a>

        <div class="mt-4 mb-2">
            <form th:action="@{/admin/logout}" method="post">
                <button type="submit" class="nav-item-link w-100 border-0 bg-transparent text-start" style="color:#f87171">
                    <i class="bi bi-box-arrow-left"></i> Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div id="topbar">
    <button class="btn btn-sm d-md-none me-2" onclick="document.getElementById('sidebar').classList.toggle('show')">
        <i class="bi bi-list fs-5"></i>
    </button>
    <span class="topbar-title" th:replace="${title}">Page</span>
    <div class="dropdown">
        <div class="topbar-avatar" data-bs-toggle="dropdown">A</div>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><h6 class="dropdown-header">Admin</h6></li>
            <li><hr class="dropdown-divider"></li>
            <li><form th:action="@{/admin/logout}" method="post">
                <button class="dropdown-item text-danger"><i class="bi bi-box-arrow-left me-2"></i>Logout</button>
            </form></li>
        </ul>
    </div>
</div>

<main id="main-content">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4">
        <i class="bi bi-exclamation-circle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <th:block th:replace="${content}"/>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setTimeout(() => {
        document.querySelectorAll('.alert').forEach(a => bootstrap.Alert.getOrCreateInstance(a).close());
    }, 4000);
    const path = window.location.pathname;
    document.querySelectorAll('.nav-item-link[href]').forEach(l => {
        if (path.startsWith(l.getAttribute('href')) && l.getAttribute('href') !== '/admin/') {
            l.classList.add('active');
        }
    });
</script>
<th:block th:replace="${extraScripts}"/>
</body>
</html>
